<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jev · 人群热点机会榜</title>
  <style>
    :root{--ink:#172033;--muted:#707b8e;--line:#e7ebf2;--page:#f6f8fc;--card:#fff;--blue:#3767ff;--lav:#f0edff;--mint:#e7faf1}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:35px 22px 62px}.eyebrow{margin:0 0 8px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}h1{margin:0;font-size:clamp(28px,4vw,43px);line-height:1.12;letter-spacing:-.055em}.sub{margin:10px 0 0;color:var(--muted)}button{border:1px solid #dce3f0;border-radius:10px;background:#fff;color:#374258;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}button:hover{border-color:#b9c7ea;color:var(--blue)}.summary{display:flex;gap:12px;align-items:stretch;margin:27px 0}.metric{flex:1;min-height:102px;padding:16px 18px;border:1px solid var(--line);border-radius:15px;background:#fff}.metric.feature{flex:1.6;color:#fff;border:0;background:linear-gradient(125deg,#396fff,#7858e7)}.label{font-size:12px;font-weight:700;color:var(--muted)}.feature .label{color:#dfe8ff}.value{display:block;margin-top:5px;font-size:29px;font-weight:800;line-height:1;letter-spacing:-.05em}.note{margin:7px 0 0;font-size:12px;color:var(--muted)}.feature .note{color:#e5eaff}.bar{display:flex;justify-content:space-between;align-items:end;margin:0 0 14px}.bar h2{margin:0;font-size:19px;letter-spacing:-.025em}.bar p{margin:0;color:var(--muted);font-size:13px}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.board{min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 4px 14px #28375908}.board-head{display:flex;align-items:center;gap:10px;padding:17px 18px 13px;border-bottom:1px solid #eef1f5}.badge{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:var(--lav);color:#654ec2;font-weight:800}.board:nth-child(2n) .badge{background:var(--mint);color:#227554}.board h3{margin:0;font-size:17px;letter-spacing:-.02em}.board small{display:block;color:var(--muted);font-size:12px}.row{display:grid;grid-template-columns:31px minmax(0,1fr) 60px;gap:9px;align-items:center;padding:14px 18px;border-bottom:1px solid #f0f2f6}.row:last-child{border-bottom:0}.rank{font-size:12px;font-weight:800;color:#9aa4b5}.title{overflow:hidden;margin:0;font-size:14px;font-weight:650;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.meta{margin-top:4px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.fit{text-align:right;color:var(--blue);font-size:18px;font-weight:850;letter-spacing:-.05em}.fit small{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0}.empty{grid-column:1/-1;padding:50px 20px;border:1px dashed #d8dfeb;border-radius:16px;background:#fff;text-align:center;color:var(--muted)}.hint{margin:16px 0 0;color:var(--muted);font-size:12px}.hint b{color:#4d5870}@media(max-width:750px){main{padding:24px 15px 44px}header{display:block}header button{margin-top:17px}.summary{display:grid;grid-template-columns:1fr 1fr}.metric.feature{grid-column:1/-1}.boards{grid-template-columns:1fr}.title{white-space:normal}.row{grid-template-columns:28px minmax(0,1fr) 55px}}
  </style>
</head>
<body><main>
  <header><div><p class="eyebrow">Jev audience opportunity intelligence</p><h1>人群热点机会榜</h1><p class="sub">同一批热点，为不同人群分别寻找最值得关注的机会。</p></div><button id="reload">刷新结果</button></header>
  <section class="summary" id="summary"></section>
  <div class="bar"><div><h2>分人群榜单</h2><p>每个榜单均按该人群的适配分排序</p></div><p id="count"></p></div>
  <section class="boards" id="boards"><p class="empty">正在读取最新分析报告…</p></section>
  <p class="hint"><b>说明：</b>人群适配分由 Jev 针对每个群体独立判断；首次更新分群规则后，请重新运行一次 Jev 分析。</p>
</main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const audienceScore=(item,name)=>{const score=item.audience_scores?.[name];return Number.isFinite(Number(score))?Number(score):Number(item.opportunity_score||0)};
function summary(items,groups){const top=items[0],scored=items.filter(x=>x.status==='jev_scored').length;return `<article class="metric feature"><span class="label">今日最高综合机会</span><strong class="value">${top?Number(top.opportunity_score).toFixed(1):'—'}</strong><p class="note">${top?esc(top.title):'等待生成分析报告'}</p></article><article class="metric"><span class="label">人群榜单</span><strong class="value">${groups.length}</strong><p class="note">独立适配排序</p></article><article class="metric"><span class="label">已分析事件</span><strong class="value">${items.length}</strong><p class="note">Jev 评分 ${scored} 条</p></article>`}
function board(name,index,items){const sorted=[...items].sort((a,b)=>audienceScore(b,name)-audienceScore(a,name)).slice(0,5);return `<article class="board"><div class="board-head"><span class="badge">${String(index+1).padStart(2,'0')}</span><div><h3>${esc(name)}</h3><small>最值得优先关注的 5 个机会</small></div></div>${sorted.map((item,i)=>`<div class="row"><span class="rank">${String(i+1).padStart(2,'0')}</span><div><p class="title" title="${esc(item.title)}">${esc(item.title)}</p><p class="meta">${esc(item.recommended_angle||'待推荐角度')} · ${esc((item.platforms||[]).join(' / ')||'热榜信号')}</p></div><div class="fit">${audienceScore(item,name).toFixed(1)}<small>适配分</small></div></div>`).join('')}</article>`}
async function load(){try{const r=await fetch('/api/opportunities');if(!r.ok)throw Error();const data=await r.json(),items=data.items||[],groups=data.audiences||[];$('summary').innerHTML=summary(items,groups);$('count').textContent=items.length?`共分析 ${items.length} 个热点事件`:'';$('boards').innerHTML=items.length&&groups.length?groups.map((g,i)=>board(g,i,items)).join(''):'<p class="empty">暂无 Jev 分析报告。请先在命令行完成热榜抓取与评分。</p>'}catch{$('boards').innerHTML='<p class="empty">读取报告失败，请确认本地服务正在运行。</p>'}}
$('reload').onclick=load;load();
</script></body></html>
