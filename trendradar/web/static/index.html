<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev 热点机会雷达</title>
<style>body{margin:0;background:#09111f;color:#e8eef9;font:15px system-ui,-apple-system,"PingFang SC";line-height:1.5}main{max-width:1120px;margin:auto;padding:38px 22px}h1{font-size:32px;margin:0}h2{font-size:18px}.sub{color:#91a2c0}button{border:0;border-radius:8px;padding:10px 16px;background:#6ee7b7;color:#062216;font-weight:700;cursor:pointer}button.secondary{background:#1b2941;color:#dce8ff}section{background:#101c30;border:1px solid #223451;border-radius:14px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}label{display:grid;gap:5px;color:#9eb0cf;font-size:13px}input,textarea{box-sizing:border-box;width:100%;border:1px solid #304464;border-radius:7px;background:#081221;color:#fff;padding:9px;font:inherit}textarea{min-height:78px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card{border-left:4px solid #6ee7b7;background:#0b1628;padding:15px;border-radius:8px}.score{font-size:27px;color:#6ee7b7;font-weight:800}.meta{color:#aab9d2;font-size:13px}.empty{color:#91a2c0}</style></head>
<body><main><header><h1>Jev 热点机会雷达</h1><p class="sub">本地运行 · 密钥只保存在本机 · Jev 负责判断，代码负责排序</p><button class="secondary" id="collect">刷新今天热榜</button> <button id="run">运行今天的机会评分</button> <button class="secondary" id="reload">刷新结果</button> <span id="job" class="sub"></span></header>
<section><h2>今日机会</h2><div id="cards" class="cards"><p class="empty">正在读取报告…</p></div></section>
<section><h2>账号画像与 API 设置</h2><p class="sub">留空的密钥不会覆盖本地已保存的值。受众和推荐角度使用 JSON 对象，可自由增删。</p><div class="grid"><label>赛道<input id="niche"></label><label>受众描述<input id="audience"></label><label>表达风格<input id="voice"></label><label>Jev API Base<input id="jevBase"></label><label>Jev API Key<input id="jevKey" type="password" placeholder="已配置则无需重复填写"></label><label>大模型 API Base<input id="llmBase"></label><label>大模型 API Key<input id="llmKey" type="password" placeholder="可选，用于 TrendRadar 自带深度分析"></label><label>大模型 Model<input id="llmModel" placeholder="例如 openai/gpt-4o-mini"></label><label>Jev 候选数<input id="limit" type="number" min="1" max="100"></label></div><p><label>目标受众 JSON<textarea id="audiences"></textarea></label></p><p><label>推荐角度 JSON<textarea id="angles"></textarea></label></p><button id="save">保存本地设置</button> <span id="saved" class="sub"></span></section></main>
<script>
const $=id=>document.getElementById(id);let settings={};
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}
function card(x){return `<article class="card"><div class="score">${x.opportunity_score}</div><strong>${x.title}</strong><p class="meta">${x.platforms.join(' · ')} ｜动量 ${x.momentum}</p><p>角度：${x.recommended_angle||'待判断'}<br>受众：${x.audience||'待判断'}<br>核查需求：${x.fact_check_needed??'—'}</p></article>`}
async function opportunities(){let d=await api('/api/opportunities');$('cards').innerHTML=d.items.length?d.items.map(card).join(''):'<p class="empty">尚无报告。先运行雷达。</p>'}
async function load(){settings=await api('/api/settings');let p=settings.creator_profile||{};$('niche').value=p.niche||'';$('audience').value=p.audience||'';$('voice').value=p.voice||'';$('audiences').value=JSON.stringify(p.target_audiences||{},null,2);$('angles').value=JSON.stringify(p.recommended_angles||{},null,2);$('jevBase').value=settings.jev.api_base||'';$('llmBase').value=settings.llm.api_base||'';$('llmModel').value=settings.llm.model||'';$('limit').value=settings.pre_filter_limit||30;await opportunities()}
$('save').onclick=async()=>{try{let profile={niche:$('niche').value,audience:$('audience').value,voice:$('voice').value,target_audiences:JSON.parse($('audiences').value),recommended_angles:JSON.parse($('angles').value)};await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({creator_profile:profile,pre_filter_limit:$('limit').value,TYPESAFE_API_KEY:$('jevKey').value,TYPESAFE_API_BASE:$('jevBase').value,AI_API_KEY:$('llmKey').value,AI_API_BASE:$('llmBase').value,AI_MODEL:$('llmModel').value})});$('saved').textContent='已保存到本机';}catch(e){$('saved').textContent='保存失败：'+e.message}};
async function start(path,label){await api(path,{method:'POST'});$('job').textContent=label;let t=setInterval(async()=>{let j=await api('/api/job');if(!j.running){clearInterval(t);$('job').textContent='已完成';opportunities()}},1500)}
$('collect').onclick=()=>start('/api/collect','正在刷新热榜…');$('run').onclick=()=>start('/api/radar','正在 Jev 评分…');$('reload').onclick=opportunities;load();
</script></body></html>
